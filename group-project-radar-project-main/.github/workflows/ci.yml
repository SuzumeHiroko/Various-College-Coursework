name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # opencv-python needs these system libs on Ubuntu
      - name: Install system dependencies
        run: sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # Lint / format
      # -----------------------------------------------------------------------

      - name: Check formatting (black)
        run: black --check src/ tests/ --line-length 100

      - name: Lint (flake8)
        run: flake8 src/ tests/

      # -----------------------------------------------------------------------
      # Tests
      #
      # Hardware tests (tests/radar_interface/) require a physical IWR6843AOP
      # EVM + Raspberry Pi and are excluded from CI. They are run manually and
      # results are recorded in docs/system_test_summary.md.
      #
      # The two offline-eligible test files (test_raw_serial.py,
      # test_viewer_simulated_radar.py) are scripts rather than pytest suites;
      # they contain no test_ functions. Pytest exit code 5 ("no tests
      # collected") is treated as success here — the import-time check still
      # validates that all dependencies resolve correctly.
      # -----------------------------------------------------------------------

      - name: Run offline tests
        env:
          MPLBACKEND: Agg   # headless matplotlib — no display required
        run: |
          set +e  # disable exit-on-error so we can inspect pytest's exit code
          pytest \
            tests/test_raw_serial.py \
            tests/test_viewer_simulated_radar.py \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short
          STATUS=$?
          # Exit code 5 = no tests collected (expected for script-style files)
          if [ $STATUS -ne 0 ] && [ $STATUS -ne 5 ]; then exit $STATUS; fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
